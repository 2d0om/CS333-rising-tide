<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev — View B (The Sea)</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 16px; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: #1d2733; background: #ffffff; }
    #log { font: 11px/16px ui-monospace, monospace; color: #64748b; height: 16px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div id="build" style="font: 11px ui-monospace, monospace; color: #64748b; height: 16px"></div>
  <div id="view-b"></div>
  <div id="log">Loading data…</div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-server@3.0.1"></script>
  <script type="module">
    import { runViewB } from '../src/standalone.js';
    import { BUILD } from '../src/viewB.js';

    const log = document.querySelector('#log');
    document.querySelector('#build').textContent = `Build: ${BUILD}`;   // if this line is missing or old, you are not running the latest code
    // same wiring as the public page (index.html); this page adds the build stamp and an event log
    await runViewB(document.querySelector('#view-b'), {
      chrome: 16 + 22,
      onEvent: (ev, v) => { if (ev !== 'hover' && ev !== 'budget') log.textContent = `event: ${ev} → ${JSON.stringify(v)}`; }
    });
    log.textContent = 'Ready. Hover, click (select), shift-click (pin), click a neighbourhood to mark it on the chart, click a period, drag the budget bar. Esc clears.';
  </script>
</body>
</html>
