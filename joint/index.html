<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rising Tide · CS333</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
/* The four views side by side on one strip. Moving between them pulls back a little, slides along the
   strip and settles on the next view, so you see they are one piece. Each view loads untouched
   (the Investor view is a copy with the team palette). */
:root {
  --night: #06121f; --bar-bg: #081b2e; --foam: #f2ead9; --mist: #8fa4b9; --line: rgba(242, 234, 217, .12);
  --bar: 52px;
  --serif: 'Source Serif 4', Georgia, serif; --sans: 'DM Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--night); color: var(--foam); font: 14px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--foam); outline-offset: 2px; }

#bar { position: fixed; left: 0; right: 0; top: 0; height: var(--bar); display: flex; align-items: center; gap: 22px;
  padding: 0 12px 0 20px; background: var(--bar-bg); border-bottom: 1px solid var(--line); z-index: 3; }
.name { font: 600 17px var(--serif); white-space: nowrap; }
#tabs { position: relative; display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: rgba(255, 255, 255, .04); }
#pill { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 7px; background: var(--pc, transparent);
  box-shadow: inset 0 0 0 1px var(--pb, transparent); pointer-events: none; }
.tab { position: relative; display: flex; align-items: center; gap: 8px; padding: 7px 16px; border-radius: 7px; color: var(--mist);
  font-weight: 500; transition: color .3s; white-space: nowrap; }
.tab i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); opacity: .8; }
.tab:hover, .tab[aria-current="page"] { color: var(--foam); }
.tab kbd { font: 500 11px var(--sans); color: rgba(143, 164, 185, .65); }
.tab:focus-visible { outline: 1px solid rgba(242, 234, 217, .45); outline-offset: -1px; }
#alone { margin-left: auto; color: var(--mist); text-decoration: none; font-size: 13px; padding: 7px 10px; border-radius: 8px; white-space: nowrap; }
#alone:hover { color: var(--foam); background: rgba(255, 255, 255, .05); }

#stage { position: fixed; left: 0; right: 0; top: var(--bar); bottom: 0; overflow: hidden; }
#scaler { position: absolute; inset: 0; transform-origin: 50% 50%; }
#track { position: absolute; left: 0; top: 0; height: 100%; }
.card { position: absolute; top: 10px; bottom: 10px; border-radius: 12px; overflow: hidden; background: #fff;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, .05), 0 20px 50px rgba(0, 0, 0, .4); }
.card iframe { position: absolute; left: 0; top: 0; border: 0; background: #fff; transform-origin: 0 0; }
.veil { position: absolute; inset: 0; display: grid; place-items: center; background: #fff; color: #16233b; text-align: center;
  transition: opacity .5s; z-index: 1; }
.veil.off { opacity: 0; pointer-events: none; }
.veil b { display: block; font: 700 13px var(--sans); color: var(--c); margin-bottom: 6px; }
.veil span { display: block; max-width: 22em; padding: 0 24px; font: 600 26px/1.2 var(--serif); }
.veil em { position: relative; display: block; width: 120px; height: 2px; margin: 18px auto 0; border-radius: 2px; overflow: hidden; background: #e5e9ef; }
.veil em::after { content: ''; position: absolute; inset: 0; width: 40%; background: var(--c); animation: run 1.1s ease-in-out infinite; }
@keyframes run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
/* the opening: the four views dealt onto the table as cards, then the camera dives into the buyer's */
#track.intro .card { cursor: pointer; border-radius: calc(12px / var(--s)); }
#track.intro .veil b { font-size: calc(13px / var(--s)); margin-bottom: calc(6px / var(--s)); }
#track.intro .veil span { font-size: calc(18px / var(--s)); line-height: 1.18; padding: 0 calc(14px / var(--s)); }
#track.intro .veil em { width: calc(70px / var(--s)); height: calc(2px / var(--s)); margin-top: calc(11px / var(--s)); }
#track.intro .card:hover { box-shadow: 0 0 0 calc(2px / var(--s)) rgba(242, 234, 217, .6), 0 20px 50px rgba(0, 0, 0, .4); }
/* while the buyer's view loads, its card fills with sea */
/* each card plays a small sketch of its own chart as it lands: the buyer's fills with sea, the developer's
   heatmap ripples into its diagonal, the planner's ribbons cross the creek, the investor's path draws itself.
   Only transform and opacity move, so the sketches stay smooth even while a view is busy loading. */
.fx { display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 38%; pointer-events: none; overflow: hidden; }
#track.intro .fx { display: block; }
#track.intro .veil { align-items: start; padding-top: calc(16px / var(--s)); }
#track.intro .veil > .txt { position: relative; z-index: 1; }
#track.intro .veil em { display: none; }
.fx .box { position: absolute; left: 50%; bottom: 0; height: 100%; aspect-ratio: 4 / 1; transform: translateX(-50%); }
.fx .box > * { position: absolute; }
.fx .rise { position: absolute; inset: 0; transform: translateY(100%); animation: rise 2.4s cubic-bezier(.3, .6, .3, 1) var(--d) forwards; will-change: transform; }
.fx .wave { position: absolute; left: 0; top: 0; width: 200%; height: 100%; background-repeat: repeat-x; background-size: 25% 100%;
  animation: drift 3.2s linear infinite; will-change: transform; }
.fx .wave.b { animation-duration: 4.6s; animation-direction: reverse; }
@keyframes rise { to { transform: none; } }
@keyframes drift { to { transform: translateX(-50%); } }
.fx .cell { border-radius: 12%; background: #2f6db0; opacity: .07; animation: cell 1.1s ease-out calc(var(--d) + var(--k)) forwards; }
.fx .cell.peak { animation-name: peak; }
@keyframes cell { 40% { opacity: .9; } to { opacity: .16; } }
@keyframes peak { 40% { opacity: .95; } to { opacity: .85; } }
.fx .bar { background: #d2631a; opacity: .75; transform: scaleY(0); transform-origin: bottom; animation: grow-y .6s ease-out calc(var(--d) + var(--k)) forwards; }
@keyframes grow-y { to { transform: none; } }
.fx .creek { overflow: hidden; }
.fx .creek svg { position: absolute; top: 0; height: 100%; }
.fx .cover { position: absolute; inset: 0; background: #fff; animation: wipe 1.3s cubic-bezier(.45, 0, .2, 1) var(--d) forwards; will-change: transform; }
@keyframes wipe { to { transform: translateX(100%); } }
.fx .seg { height: var(--w); border-radius: 99px; transform-origin: 0 50%;
  transform: translateY(-50%) rotate(var(--a)) scaleX(0); animation: seg 90ms linear calc(var(--d) + var(--k)) forwards; }
@keyframes seg { to { transform: translateY(-50%) rotate(var(--a)) scaleX(1); } }
.fx .dot { width: 1.4%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); opacity: 0; animation: pop .25s ease-out calc(var(--d) + var(--k)) forwards; }
@keyframes pop { to { opacity: 1; } }
.fx .arrow { height: 2%; border-top: 2px dashed rgba(140, 147, 168, .55); transform-origin: 0 0; opacity: 0; animation: pop .6s ease-out var(--d) forwards; }
#hint { position: fixed; left: 0; right: 0; bottom: 9%; margin: 0; text-align: center; color: var(--mist); font-size: 14px;
  opacity: 0; transition: opacity .4s; pointer-events: none; }
#lead { position: fixed; left: 0; right: 0; margin: 0; text-align: center; font: 600 22px var(--serif); color: var(--foam);
  pointer-events: none; opacity: 0; transition: opacity .6s; }
#boot { position: fixed; inset: var(--bar) 0 0; margin: 0; display: grid; place-items: center; color: var(--mist); font-size: 15px;
  transition: opacity .4s; pointer-events: none; }

@media (max-width: 760px) { .name, .tab kbd, #alone { display: none; } .tab { padding: 7px 10px; } #bar { padding-left: 8px; } }
@media (prefers-reduced-motion: reduce) { .veil em::after, .fx .wave { animation: none; } }
</style>
</head>
<body>
<header id="bar">
  <span class="name">Rising Tide</span>
  <nav id="tabs" aria-label="The four views"><span id="pill"></span></nav>
  <a id="alone" href="../" target="_blank" rel="noopener">Open on its own page ↗</a>
</header>
<main id="stage"><div id="scaler"><div id="track"></div></div></main>
<p id="boot"></p>
<p id="hint"></p>
<p id="lead">Four questions about Dubai's property boom, 2015 to 2026</p>

<script>
// The four views, in order along the strip. The buyer's view (this repo) opens first.
const VIEWS = [
  { key: 'buyer', role: 'Buyer', colour: '#5ea6e4', q: 'Where can my budget still buy?', src: '../', fixed: true },   // one screen: see fit()
  { key: 'developer', role: 'Developer', colour: '#ef8a4c', q: 'Where is apartment buying concentrated, and where are land plots sold?',
    src: 'https://urwahsheikha.github.io/cs333-view-c/' },
  { key: 'planner', role: 'Planner', colour: '#e8656e', q: 'Do sales happen where people live?',
    src: 'https://babar-nabeel.github.io/Data-Viz-Project/' },
  { key: 'investor', role: 'Investor', colour: '#46b8a8', q: 'Who is paying, and with what money?',
    src: 'views/investor/' }                                    // zmashd's view, a copy with the team palette
];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const tabs = $('tabs'), pill = $('pill'), track = $('track'), scaler = $('scaler'), stage = $('stage'), alone = $('alone');
const MIN_W = 1240;          // the views are laid out for at least this width; a narrower screen shows them slightly smaller
let cur = 0, CW = 0, GAP = 28, busy = false, queued = null, opening = null;

// The sketches on the opening cards: a 400 x 100 box along the bottom of each card (x in 1/400 of its
// width, y in 1/100 of its height). Built from plain boxes so only transform and opacity animate.
const waveSvg = (y, amp, fill) => `url('data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 ${y} Q25 ${y - amp} 50 ${y} T100 ${y} V100 H0 Z" fill="${fill}"/></svg>`)}')`;
const at = (x, y, w, h) => `left:${x / 4}%;top:${y}%;width:${w / 4}%;height:${h}%`;
const FX = {
  // the sea rises in the card while the view loads
  buyer: () => `<div class="fx" aria-hidden="true"><div class="rise">
      <div class="wave b" style="background-image:${waveSvg(30, 9, 'rgba(94,166,228,.16)')}"></div>
      <div class="wave" style="background-image:${waveSvg(38, 10, 'rgba(94,166,228,.28)')}"></div></div></div>`,
  // projects by year: a ripple runs through the heatmap and leaves the diagonal of peak years; land plots pile up
  developer: () => { let r = '';
    for (let row = 0; row < 4; row++) for (let col = 0; col < 16; col++)
      r += `<i class="cell${Math.abs(col - (2 + row * 4)) <= 1 ? ' peak' : ''}" style="${at(8 + col * 24, 8 + row * 17, 21, 14)};--k:${col * 45 + row * 90}ms"></i>`;
    [6, 8, 7, 11, 15, 22, 30, 41, 55, 68].forEach((h, k) => {
      r += `<i class="bar" style="${at(206 + k * 19, 100 - h * .26, 14, h * .26)};--k:${700 + k * 60}ms"></i>`; });
    return `<div class="fx" aria-hidden="true"><div class="box">${r}</div></div>`; },
  // residents on the left, flat sales on the right: the red few carry half the sales, most ribbons stop mid-creek
  planner: () => `<div class="fx" aria-hidden="true"><div class="box">
      <div class="creek" style="${at(48, 0, 304, 100)}">
        <svg viewBox="48 0 304 100" preserveAspectRatio="none" style="left:0;width:100%">
          <defs><linearGradient id="jetty" x1="0" x2="1"><stop offset="0" stop-color="#4f86b5" stop-opacity=".6"/><stop offset="1" stop-color="#4f86b5" stop-opacity="0"/></linearGradient></defs>
          <path d="M48 8 C200 8 200 6 352 6 L352 50 C200 50 200 20 48 20 Z" fill="#d1495b" opacity=".75"/>
          <path d="M48 24 C200 24 200 54 352 54 L352 92 C200 92 200 48 48 48 Z" fill="#dcb46b" opacity=".75"/>
          <path d="M48 52 C150 52 180 60 230 64 L230 92 C180 92 150 92 48 92 Z" fill="url(#jetty)"/></svg>
        <div class="cover"></div></div>
      <i style="${at(40, 8, 8, 12)};background:#d1495b"></i><i style="${at(40, 24, 8, 24)};background:#dcb46b"></i><i style="${at(40, 52, 8, 40)};background:#4f86b5"></i>
      <i style="${at(352, 6, 8, 44)};background:#d1495b"></i><i style="${at(352, 54, 8, 38)};background:#dcb46b"></i></div></div>`,
  // rate against sales: the textbook says down and to the right; the path climbs up and to the right instead
  investor: () => { const pts = [[70, 86], [100, 84], [130, 87], [112, 85], [40, 88], [30, 82], [34, 76], [120, 70], [230, 66], [330, 60], [362, 58], [364, 40], [366, 30], [330, 22], [300, 14], [292, 26]];
    const col = i => i < 3 ? '#8795ad' : i < 6 ? '#2f6db0' : i < 9 ? '#d1495b' : i < 12 ? '#4a2c7a' : '#4bab78';
    const line = (x1, y1, x2, y2) => ({ len: Math.hypot(x2 - x1, y2 - y1), a: Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI });
    const A = line(40, 10, 370, 90);
    let r = `<i class="arrow" style="left:10%;top:10%;width:${A.len / 4}%;transform:rotate(${A.a}deg)"></i>`;
    r += `<i class="dot" style="left:${pts[0][0] / 4}%;top:${pts[0][1]}%;background:${col(0)};--k:0ms"></i>`;
    pts.slice(1).forEach((p, i) => { const q = pts[i], L = line(q[0], q[1], p[0], p[1]);
      r += `<i class="seg" style="left:${q[0] / 4}%;top:${q[1]}%;width:${L.len / 4}%;--a:${L.a}deg;--w:${2.2 + i * .14}%;background:${col(i + 1)};--k:${i * 85}ms"></i>`;
      r += `<i class="dot" style="left:${p[0] / 4}%;top:${p[1]}%;background:${col(i + 1)};--k:${i * 85 + 80}ms"></i>`; });
    return `<div class="fx" aria-hidden="true"><div class="box">${r}</div></div>`; }
};

// ---------------------------------------------------------------------
// tabs and cards
// ---------------------------------------------------------------------
VIEWS.forEach((v, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tab'; b.style.setProperty('--c', v.colour); b.title = v.q;
  b.innerHTML = `<i></i>${v.role}<kbd>${i + 1}</kbd>`;
  b.addEventListener('click', () => go(i));
  tabs.appendChild(b); v.tab = b;

  const card = document.createElement('section');
  card.className = 'card ' + v.key; card.style.setProperty('--c', v.colour); card.setAttribute('aria-label', `${v.role}: ${v.q}`);
  card.innerHTML = `<div class="veil"><div class="txt"><b>${v.role}</b><span>${v.q}</span><em></em></div>${FX[v.key]()}</div>`;
  card.style.setProperty('--d', 640 + i * 170 + 'ms');               // starts as the card lands
  track.appendChild(card); v.card = card; v.veil = card.firstChild;
});
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
function placePill(i, ms = 0) {
  const t = VIEWS[i].tab, ease = 'cubic-bezier(.65,0,.35,1)';
  pill.style.transition = ms ? `left ${ms}ms ${ease}, width ${ms}ms ${ease}, background-color ${ms}ms, box-shadow ${ms}ms` : 'none';
  pill.style.left = t.offsetLeft + 'px'; pill.style.width = t.offsetWidth + 'px';
  pill.style.setProperty('--pc', rgba(VIEWS[i].colour, .2)); pill.style.setProperty('--pb', rgba(VIEWS[i].colour, .55));
  VIEWS.forEach((v, k) => k === i ? v.tab.setAttribute('aria-current', 'page') : v.tab.removeAttribute('aria-current'));
}

// ---------------------------------------------------------------------
// layout: one card per view, side by side; the strip moves, the cards stay put
// ---------------------------------------------------------------------
const xOf = i => -i * (CW + GAP);
function layout() {
  const W = stage.clientWidth, pad = 10;
  CW = W - 2 * pad; GAP = Math.round(W * .02) + 12;
  VIEWS.forEach((v, i) => { v.card.style.left = pad + i * (CW + GAP) + 'px'; v.card.style.width = CW + 'px'; if (v.frame) fit(v); });
  track.style.transform = `translateX(${xOf(cur)}px)`;
  placePill(cur);
}
// The buyer's view fills one screen and lays itself out once, so it is laid out for this screen in full
// screen and only scaled to fit the card: exact in full screen, the same picture a little smaller in a
// window, and nothing ever has to be redrawn when the window changes. The other views reflow by themselves.
const BAR = 52;                    // = --bar
let design = null;
function fit(v) {
  const W = CW, H = v.card.clientHeight, el = v.frame;
  if (v.fixed) {
    const d = design || (design = { w: Math.max(MIN_W, screen.width - 20), h: Math.max(688, screen.height - BAR - 20) });
    const k = Math.min(W / d.w, H / d.h);
    el.style.width = d.w + 'px'; el.style.height = d.h + 'px';
    el.style.transform = `translate(${(W - d.w * k) / 2}px, ${(H - d.h * k) / 2}px) scale(${k})`;
    return;
  }
  const k = Math.min(1, W / MIN_W);
  el.style.width = W / k + 'px'; el.style.height = H / k + 'px'; el.style.transform = k < 1 ? `scale(${k})` : '';
}   // every view follows a new frame size itself (the buyer's view lays itself out again), so nothing reloads

// ---------------------------------------------------------------------
// loading: the first view during the opening, the others quietly after it, so moving between views never
// waits. A view that is still loading shows a white card with its question until it is ready.
// ---------------------------------------------------------------------
function load(v) {
  if (!v.frame) { v.frame = document.createElement('iframe'); v.frame.title = `${v.role}: ${v.q}`; v.frame.setAttribute('allow', 'fullscreen'); v.card.appendChild(v.frame); }
  fit(v);
  v.ready = false;
  v.loaded = new Promise(res => v.frame.addEventListener('load', async () => {
    if (v.key === 'buyer') for (let i = 0; i < 150; i++) {          // same site: wait until its map is drawn
      try { if (v.frame.contentWindow.__viewB) break; } catch (e) { break; }
      await new Promise(r => setTimeout(r, 100));
    }
    v.ready = true; res();
  }, { once: true }));
  v.frame.src = v.src;
  return v.loaded;
}
async function reveal(v) {
  await Promise.race([v.loaded, new Promise(r => setTimeout(r, 25000))]);
  v.shown = true; v.veil.classList.add('off');
}
async function preloadRest() {          // the others load one after another while the buyer's view is on screen
  for (const v of VIEWS) if (!v.frame)
    await Promise.race([load(v).then(() => { v.shown = true; v.veil.classList.add('off'); }), new Promise(r => setTimeout(r, 15000))]);
}

// ---------------------------------------------------------------------
// moving: pull back, slide along the strip, settle. One continuous motion; longer jumps pull back further.
// ---------------------------------------------------------------------
async function go(i, { push = true } = {}) {
  i = (i + VIEWS.length) % VIEWS.length;
  if (opening) return opening(i);
  if (busy) { queued = i; return; }
  if (i === cur) return;
  busy = true;
  const from = cur, v = VIEWS[i], d = Math.abs(i - from);
  if (push) history.pushState(null, '', '#' + v.key);
  if (!v.frame) { v.veil.classList.remove('off'); v.shown = false; load(v); }                        // not loaded yet (rare)
  else if (v.ready) { v.shown = true; v.veil.classList.add('off'); }                                  // loaded already: no wait
  const ms = reduce ? 480 : 820 + 160 * (d - 1), S = 1 - .07 - .035 * (d - 1);
  placePill(i, ms);
  alone.href = new URL(v.src, location.href).href;
  cur = i;
  if (reduce) {                       // reduced motion: a quick cross-fade instead of the slide
    const out = scaler.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' });
    await out.finished;
    track.style.transform = `translateX(${xOf(i)}px)`;
    const inn = scaler.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 280 }); out.cancel();
    await inn.finished;
  } else {
    track.style.transform = `translateX(${xOf(i)}px)`;
    const a1 = track.animate([{ transform: `translateX(${xOf(from)}px)` }, { transform: `translateX(${xOf(i)}px)` }],
      { duration: ms, easing: 'cubic-bezier(.65,0,.35,1)' });
    const a2 = scaler.animate([{ transform: 'scale(1)' }, { transform: `scale(${S})`, offset: .45 }, { transform: 'scale(1)' }],
      { duration: ms, easing: 'ease-in-out' });
    await Promise.all([a1.finished, a2.finished]);
  }
  if (!v.shown) reveal(v);
  busy = false;
  if (queued !== null) { const q = queued; queued = null; go(q); }
}

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.activeElement && document.activeElement.classList.contains('tab')) document.activeElement.blur();   // the pill shows where you are
  if (/^[1-4]$/.test(e.key)) go(+e.key - 1);
  else if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
});
addEventListener('popstate', () => { const k = VIEWS.findIndex(v => '#' + v.key === location.hash); go(k < 0 ? 0 : k, { push: false }); });
// a new window size (full screen, a resized window) is applied in the same frame, before anything is painted
let relayout = false;
new ResizeObserver(() => { if (opening) relayout = true; else layout(); }).observe(stage);

// ---------------------------------------------------------------------
// the opening, every time the page opens: the four views are dealt onto the table as cards, each sketching
// its chart, the tab light hops along as they land, then the camera dives into the buyer's view (or the one
// in the link), already drawn under its card. A click on a card, a tab or a number key picks another.
// With reduced motion the cards fade in and the dive is a cross-fade.
// ---------------------------------------------------------------------
async function intro(first = 0) {
  const W = stage.clientWidth, pad = 10, stripW = VIEWS.length * CW + (VIEWS.length - 1) * GAP;
  const s0 = Math.min(.3, W * .88 / stripW), x0 = W / 2 - (pad + stripW / 2);
  let target = first, wake;
  const woken = new Promise(r => wake = r);
  opening = i => { target = i; placePill(i, 300); wake(); };
  const onKey = e => { if (/^[1-4]$/.test(e.key)) target = +e.key - 1; wake(); };
  addEventListener('keydown', onKey);
  VIEWS.forEach((v, i) => v.card.onclick = () => opening && opening(i));

  $('boot').style.opacity = 0;
  track.classList.add('intro'); scaler.style.setProperty('--s', s0);
  scaler.style.transform = `scale(${s0})`; track.style.transform = `translateX(${x0}px)`;
  pill.style.opacity = 0;
  load(VIEWS[first]);                                                 // the first view draws itself under its card
  const lead = $('lead');
  lead.style.top = (stage.getBoundingClientRect().top + H() / 2 - stage.clientHeight / 2 * s0 - 58) + 'px';
  setTimeout(() => { if (opening) lead.style.opacity = 1; }, 900);

  // deal: each card drops in with a little tilt and a bounce
  const deals = VIEWS.map((v, i) => v.card.animate([
    { transform: reduce ? 'none' : `translateY(${H() * .7}px) rotate(${i % 2 ? -7 : 6}deg) scale(.9)`, opacity: 0 },
    { transform: 'none', opacity: 1 }],
    { duration: 760, delay: 200 + i * 170, easing: 'cubic-bezier(.18,1.45,.4,1)', fill: 'backwards' }));
  VIEWS.forEach((v, i) => setTimeout(() => { pill.style.opacity = 1; placePill(i, 240); }, 200 + i * 170 + 420));
  await Promise.race([Promise.all(deals.map(a => a.finished)), woken]);
  deals.forEach(a => a.finish());
  setTimeout(() => placePill(target, 420), 250);                      // the light settles on where we are going
  await Promise.race([new Promise(r => setTimeout(r, 1700)), woken]);   // a moment to read the four questions

  // wait for the chosen view, if it is still loading
  const v = VIEWS[target];
  if (!v.frame) load(v);
  if (!v.ready) { $('hint').textContent = target === 0 ? 'Filling the sea…' : 'Loading…'; $('hint').style.opacity = 1; }
  await Promise.race([v.loaded, new Promise(r => setTimeout(r, 30000))]);
  $('hint').style.opacity = 0;

  // dive
  opening = null; removeEventListener('keydown', onKey); VIEWS.forEach(x => x.card.onclick = null);
  cur = target; placePill(target, 1150);
  if (target) history.replaceState(null, '', '#' + v.key);
  alone.href = new URL(v.src, location.href).href;
  // the strip jumps to its final place at once; the camera starts where the overview was and closes in on
  // the chosen card, which grows and drifts to the middle while the others slide away past the edges
  const ease = 'cubic-bezier(.7,0,.18,1)', xEnd = xOf(target);
  scaler.style.transform = ''; track.style.transform = `translateX(${xEnd}px)`;
  $('lead').style.opacity = 0;
  if (reduce) {
    scaler.style.transform = `scale(${s0})`; track.style.transform = `translateX(${x0}px)`;   // still the overview
    const out = scaler.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' });
    await out.finished;
    scaler.style.transform = ''; track.style.transform = `translateX(${xEnd}px)`;
    track.classList.remove('intro'); v.veil.classList.add('off');
    const inn = scaler.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 350 }); out.cancel();
    await inn.finished;
  } else {
    const a1 = scaler.animate([{ transform: `translateX(${s0 * (x0 - xEnd)}px) scale(${s0})` }, { transform: 'translateX(0px) scale(1)' }],
      { duration: 1250, easing: ease });
    v.veil.style.transition = 'opacity .45s'; v.veil.classList.add('off');   // the card turns into the live view as we dive
    await a1.finished;
    v.veil.style.transition = ''; track.classList.remove('intro');
  }
  v.shown = true;
  if (relayout) { relayout = false; layout(); }
}
const H = () => stage.clientHeight;

// ---------------------------------------------------------------------
// start: the buyer's view (or the one named in the link) rises into place once it is drawn
// ---------------------------------------------------------------------
(async () => {
  try { await document.fonts.ready; } catch (e) {}
  const k = VIEWS.findIndex(v => '#' + v.key === location.hash);
  cur = k < 0 ? 0 : k;
  layout();
  await intro(cur);
  setTimeout(preloadRest, 300);
})();
</script>
